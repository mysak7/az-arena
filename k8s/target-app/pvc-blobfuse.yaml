# FAULT_005: BlobFuse2 PV without lease break timeout or --use-adls.
# If VMSS node dies with this volume mounted, Azure Storage holds a stale lease.
# New pod gets stuck in ContainerCreating: "failed to acquire blob lease"
# Fix: add mountOptions: [--lease-duration=15, --cancel-list-on-mount-failure=true]
apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-weights-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: blob.csi.azure.com
    readOnly: false
    volumeHandle: model-weights-unique-id
    volumeAttributes:
      resourceGroup: "rg-dev-euc1-chaos-arena"
      storageAccount: "stdevchaosbattle"
      containerName: "model-weights"
      protocol: fuse2
    nodeStageSecretRef:
      name: azure-blob-secret
      namespace: target
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights-pvc
  namespace: target
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: model-weights-pv
  storageClassName: ""
