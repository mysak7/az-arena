# Default deny-all for target namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: target
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from ingress-nginx only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: target
spec:
  podSelector:
    matchLabels:
      app: target-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
---
# Allow egress to PostgreSQL + CosmosDB + Azure APIs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-deps
  namespace: target
spec:
  podSelector:
    matchLabels:
      app: target-app
  policyTypes:
    - Egress
  egress:
    # PostgreSQL in arena namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arena
      ports:
        - protocol: TCP
          port: 5432
    # CosmosDB + Azure Storage (HTTPS)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
