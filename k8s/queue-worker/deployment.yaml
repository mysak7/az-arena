apiVersion: v1
kind: ServiceAccount
metadata:
  name: queue-worker-sa
  namespace: arena
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-worker
  namespace: arena
  labels:
    app: queue-worker
spec:
  replicas: 0   # KEDA manages replica count — starts at 0 (scale-to-zero)
  selector:
    matchLabels:
      app: queue-worker
  template:
    metadata:
      labels:
        app: queue-worker
    spec:
      serviceAccountName: queue-worker-sa
      nodeSelector:
        "arena/role": "workload"
      containers:
        - name: queue-worker
          image: acrdevarena.azurecr.io/queue-worker:latest
          ports:
            - name: metrics
              containerPort: 8001
          env:
            - name: POSTGRES_HOST
              value: "postgresql.arena.svc.cluster.local"
            - name: POSTGRES_DB
              value: "arena"
            - name: POSTGRES_USER
              value: "arena"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: WORKER_BATCH_SIZE
              value: "3"
            - name: POLL_INTERVAL_SECONDS
              value: "2"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: queue-worker
  namespace: arena
  labels:
    app: queue-worker
spec:
  selector:
    app: queue-worker
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
  type: ClusterIP
