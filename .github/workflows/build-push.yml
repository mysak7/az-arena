name: Build & Push Images

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: "Build · ${{ matrix.app }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [target-app, arena-dashboard, queue-worker]

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name acrdevarena

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.app }})
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.app }}
          file: src/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            acrdevarena.azurecr.io/${{ matrix.app }}:latest
            acrdevarena.azurecr.io/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rolling restart if cluster is up
  rollout:
    name: "Rollout · ${{ matrix.app }}"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - app: target-app
            namespace: target
            deploy: target-app
          - app: arena-dashboard
            namespace: arena
            deploy: arena-dashboard
          - app: queue-worker
            namespace: arena
            deploy: queue-worker
    continue-on-error: true  # cluster might be down (auto-teardown)

    steps:
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-dev-euc1-arena \
            --name aks-dev-euc1-arena \
            --overwrite-existing 2>/dev/null || true

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/${{ matrix.deploy }} \
            -n ${{ matrix.namespace }} 2>/dev/null || echo "Cluster not available, skipping rollout"
